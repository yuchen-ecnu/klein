# SPDX-License-Identifier: Apache-2.0
name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/docs.yml"
      - "Makefile"
      - "docs/**"
      - "scripts/build_versioned_docs.py"
      - "scripts/check_doc_translations.py"
      - "src/**"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "pip==26.2.1"
      - run: python -m pip install --constraint requirements/ci-constraints.txt -e ".[all,docs]"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
        id: pages
      - name: Build latest and retained release documentation
        run: >-
          python scripts/build_versioned_docs.py
          --output "$RUNNER_TEMP/klein-pages"
          --base-url "${{ steps.pages.outputs.base_url }}"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/klein-pages

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
