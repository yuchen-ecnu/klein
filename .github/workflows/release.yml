# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Annotated tag at the current main commit (for example v0.1.0a1)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify the default branch, annotated tag, and package version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          package_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${RELEASE_TAG#v}" = "$package_version"
      - name: Verify maintainer authorization and successful exact-commit CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python scripts/check_release_evidence.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --default-branch "$DEFAULT_BRANCH" \
            --output release-evidence.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence
          path: release-evidence.json
          if-no-files-found: error

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install "pip==26.2.1"
      - run: python -m pip install --constraint requirements/ci-constraints.txt "build==1.5.0" "twine==7.0.0" "pip-audit==2.10.1"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-evidence
          path: release/metadata/
      - name: Build the canonical source archive
        run: |
          python scripts/build_source_release.py --ref "$GITHUB_SHA" --output-dir release/source
          mkdir -p "$RUNNER_TEMP/klein-source"
          tar -xzf release/source/*-src.tar.gz -C "$RUNNER_TEMP/klein-source"
          echo "CANONICAL_SOURCE_ROOT=$RUNNER_TEMP/klein-source/ray-klein-${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Build Dashboard and Python distributions from the source archive
        run: |
          cd "$CANONICAL_SOURCE_ROOT/frontend"
          npm ci
          npm run licenses
          npm run build
          cd "$CANONICAL_SOURCE_ROOT"
          python -m build --outdir "$GITHUB_WORKSPACE/release/python"
      - run: python -m twine check --strict release/python/*
      - run: python scripts/check_distribution.py release/python/* release/source/*
      - name: Verify the wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/klein-wheel"
          "$RUNNER_TEMP/klein-wheel/bin/python" -m pip install "pip==26.2.1"
          "$RUNNER_TEMP/klein-wheel/bin/python" -m pip install --constraint requirements/ci-constraints.txt release/python/*.whl
          "$RUNNER_TEMP/klein-wheel/bin/python" scripts/check_ray_namespace.py
          "$RUNNER_TEMP/klein-wheel/bin/python" -c "import ray.klein; assert callable(ray.klein.pipeline)"
          "$RUNNER_TEMP/klein-wheel/bin/ray-klein" --version
          "$RUNNER_TEMP/klein-wheel/bin/python" -m pip check
      - name: Generate dependency inventories and checksums
        run: |
          wheel=$(realpath release/python/*.whl)
          python -m pip install --constraint requirements/ci-constraints.txt --target "$RUNNER_TEMP/klein-sbom-base" "$wheel"
          python -m pip install --constraint requirements/ci-constraints.txt --target "$RUNNER_TEMP/klein-sbom-all" "ray-klein[all] @ file://$wheel"
          # OSV can audit the candidate before its version exists on PyPI.
          pip-audit --strict --vulnerability-service osv --path "$RUNNER_TEMP/klein-sbom-base" --format cyclonedx-json --output release/metadata/python-wheel-base-sbom.cdx.json --progress-spinner off
          pip-audit --strict --vulnerability-service osv --path "$RUNNER_TEMP/klein-sbom-all" --format cyclonedx-json --output release/metadata/python-wheel-all-sbom.cdx.json --progress-spinner off
          cd "$CANONICAL_SOURCE_ROOT/frontend"
          npm sbom --omit=dev --sbom-format=cyclonedx > "$GITHUB_WORKSPACE/release/metadata/frontend-sbom.cdx.json"
          cd "$GITHUB_WORKSPACE/release"
          find source python metadata -type f ! -name SHA512SUMS -print0 | sort -z | xargs -0 sha512sum > metadata/SHA512SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-artifacts
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/ray-klein/
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-artifacts
          path: release/
      - name: Verify artifact checksums
        run: cd release && sha512sum --check metadata/SHA512SUMS
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: |
            release/source/*
            release/python/*
            release/metadata/SHA512SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release/python/
          attestations: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-artifacts
          path: release/
      - name: Publish GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            release/source/* release/python/* release/metadata/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes \
            --title "Klein ${RELEASE_TAG}" \
            "${release_flags[@]}"
