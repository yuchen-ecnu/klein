# SPDX-License-Identifier: Apache-2.0
name: Fuzzing

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "requirements/ci-constraints.txt"
      - "src/ray/klein/state/restricted_pickle.py"
      - "tests/fuzz/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/fuzz.yml"
      - "requirements/ci-constraints.txt"
      - "src/ray/klein/state/restricted_pickle.py"
      - "tests/fuzz/**"
  schedule:
    - cron: "19 3 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  restricted-pickle:
    name: Restricted pickle decoder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/ci-constraints.txt
      - run: python -m pip install "pip==26.2"
      - run: python -m pip install --constraint requirements/ci-constraints.txt atheris
      - run: mkdir -p fuzz-artifacts
      - name: Run bounded fuzzing smoke test
        if: github.event_name != 'schedule'
        run: >-
          PYTHONPATH=src python tests/fuzz/fuzz_restricted_pickle.py
          tests/fuzz/corpus/restricted_pickle
          -runs=50000 -max_len=65536 -timeout=5
          -artifact_prefix=fuzz-artifacts/
      - name: Run scheduled fuzzing campaign
        if: github.event_name == 'schedule'
        run: >-
          PYTHONPATH=src python tests/fuzz/fuzz_restricted_pickle.py
          tests/fuzz/corpus/restricted_pickle
          -max_total_time=600 -max_len=65536 -timeout=5
          -artifact_prefix=fuzz-artifacts/
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: restricted-pickle-fuzz-artifacts
          path: fuzz-artifacts
          if-no-files-found: ignore
          retention-days: 14
