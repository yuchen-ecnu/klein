version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    exclude-paths:
      - "requirements/minimum-constraints.txt"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      codeql:
        patterns: ["github/codeql-action/*"]
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        versions: [">=23"]
    groups:
      frontend-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
